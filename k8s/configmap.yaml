apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-monitoring-config
  namespace: payment-monitoring
data:
  KAFKA_BROKERS: "kafka-headless.kafka:9092"
  CLICKHOUSE_HOST: "clickhouse.clickhouse"
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DATABASE: "payments"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-monitoring-secrets
  namespace: payment-monitoring
type: Opaque
stringData:
  SLACK_WEBHOOK_URL: ""
  PAGERDUTY_KEY: ""
  LLM_API_KEY: ""
