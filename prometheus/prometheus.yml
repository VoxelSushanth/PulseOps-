global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'synthetic-generator'
    static_configs:
      - targets: ['synthetic-generator:8080']
    metrics_path: '/metrics'

  - job_name: 'stream-processor'
    static_configs:
      - targets: ['stream-processor:8080']
    metrics_path: '/metrics'

  - job_name: 'anomaly-detector'
    static_configs:
      - targets: ['anomaly-detector:8080']
    metrics_path: '/metrics'

  # ClickHouse metrics via clickhouse-exporter (if available)
  - job_name: 'clickhouse'
    static_configs:
      - targets: ['clickhouse:9363']
